# 重录 .repolish/demo.svg 并提交回仓库。
#
# **只手动触发**，理由和从前那个 GIF 版本不完全一样，值得写清楚。
#
# 格式的问题已经解决了：产物现在是一张文本 SVG，diff 得动，也不会像 GIF 那样
# 每次重渲都往历史里塞一个几百 KB 的二进制块。
#
# 剩下的是**内容**的问题，那个解决不了：录屏里有样例仓库的 commit 哈希（每次
# setup.sh 重建都不同）。如果把样例的提交时间写死好让哈希稳定，那个仓库就变成
# 一个「一年多没人动」的仓库，`activity` 判 P1 盖过演示本身，而且报告里会出现
# 「last commit N days ago」——那句话每天都在变，比哈希还不稳。
#
# 换句话说：这段录屏做不到既确定又与时间无关。所以它跟着内容变，不跟着 push 变。
name: demo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    name: re-record the demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 录的是这个 commit 构建出来的 repolish，不是碰巧装在 runner 上的某个版本
      - name: Build and put repolish on PATH
        run: |
          cargo build --release
          echo "${GITHUB_WORKSPACE}/target/release" >> "$GITHUB_PATH"

      # 真的前后对比：对一个故意写得很糙的样例仓库跑一遍干跑、--apply、再跑一遍。
      # 录屏里那两个分数就是这一次跑出来的分数。
      - name: Record
        run: |
          sample="$(bash ./demo/setup.sh)"
          repolish "$sample" --stages demo --apply \
            --cmd "repolish" \
            --cmd "repolish --apply" \
            --cmd "repolish" \
            --output "${GITHUB_WORKSPACE}/.repolish/demo.svg"

      - name: Commit it
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add .repolish/demo.svg
          git diff --staged --quiet || git commit -m "chore: re-record the demo"
          git push
