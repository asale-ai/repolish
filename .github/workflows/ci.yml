name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 三个平台都要跑：路径处理在 Windows 上有单独的分支（dunce），
        # 而 M3 要出多平台二进制，破在发布时才发现就太晚了。
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # 格式与平台无关，跑一次就够——塞进 test 矩阵会白跑三遍
      - run: cargo fmt --all -- --check

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # rust-version 是对使用者的承诺，只有 CI 会替我们守住它
      - run: cargo check --workspace

  # npm 壳自己解 tar 和 zip（为了不引依赖），那段代码没有上游在维护，
  # 所以它自己要有测试。这个 job 也守着「package.json 的版本 == workspace 的
  # 版本」——版本号是下载 URL 的一部分,漂了就会装到一个版本号说 A、
  # 二进制是 B 的东西。
  npm-shim:
    name: npm shim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node npm/test.js

  self:
    name: repolish check .
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release-hygiene 要看 tag；默认的 fetch-depth: 1 一个都拉不到
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 自评。分数线暂时不设死——先让每次 PR 都能看到分数怎么动的。
      # 这里直接用源码构建而不是用 action，因为 action 下载的是已发布的版本，
      # 那样测的就不是这个 PR 的改动了。
      #
      # **这个 job 不写回仓库。** 从前它会把徽章、卡片、表格图和 REPOLISH.md
      # 重新生成并提交回 main，每次 push 一条 "chore: update repolish score"。
      # 那样做有两个实际代价：一是任何人在本地重新生成同样的文件，都会和
      # 那条自动提交撞车（连着五次 rebase 冲突之后，这条就该改了）；二是
      # 一个会自己往 main 上推提交的 CI，需要 contents: write 权限，而它现在
      # 只是在读和报告。
      #
      # 产物改由手动的 artifacts workflow 重新生成，见 .github/workflows/artifacts.yml。
      - name: Score this repository
        run: |
          cargo run --release -- check . --remote --no-color
          cargo run --release -- check . --remote --no-color --format markdown \
            >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
