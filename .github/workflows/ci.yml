name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 三个平台都要跑：路径处理在 Windows 上有单独的分支（dunce），
        # 而 M3 要出多平台二进制，破在发布时才发现就太晚了。
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # 格式与平台无关，跑一次就够——塞进 test 矩阵会白跑三遍
      - run: cargo fmt --all -- --check

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # rust-version 是对使用者的承诺，只有 CI 会替我们守住它
      - run: cargo check --workspace

  self:
    name: repolish check .
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # release-hygiene 要看 tag；默认的 fetch-depth: 1 一个都拉不到
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 自评。分数线暂时不设死——先让每次 PR 都能看到分数怎么动的。
      # 这里直接用源码构建而不是用 action，因为 action 下载的是已发布的版本，
      # 那样测的就不是这个 PR 的改动了。
      - name: Score this repository
        run: |
          cargo run --release -- check . --remote --no-color --badge --report
          cat REPOLISH.md >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 徽章要能更新，badge.json 就必须留在仓库里：
      # shields.io 读的是 raw.githubusercontent.com 上的这个文件。
      - name: Commit badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add .repolish/badge.json REPOLISH.md
          git diff --staged --quiet || git commit -m "chore: update repolish score"
          git push
