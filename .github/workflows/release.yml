# 发布多平台二进制。
#
# 本来打算用 cargo-dist（docs/01-architecture.zh-CN.md 的选型），改为手写有两个原因：
# 一是本地装不上（构建脚本被杀软拦掉）；二是产物命名要与 action.yml 里的
# 下载 URL 逐字对齐，手写这一份让两边在同一个仓库里可以对照检查。
#
# 归档命名是**契约**：action.yml 按 repolish-v{version}-{target}.{ext} 拼 URL。
# 改这里就必须同步改那里，否则所有引用了旧版本的 workflow 会在下载步骤挂掉。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64-apple-darwin 从 arm64 的 macos-latest 交叉编译，不用 Intel
          # runner：v0.1.0 第一次发布时 macos-13 排了半小时没拿到机器，同批
          # 其他 job 几分钟就跑完了。Apple 的工具链原生支持双架构，
          # `targets:` 会把 std 装好，交叉编译不需要额外配置。
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  ext: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-latest,     target: x86_64-apple-darwin,       ext: tar.gz }
          - { os: macos-latest,     target: aarch64-apple-darwin,      ext: tar.gz }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    ext: zip }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p repolish

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          # workflow_dispatch 时 GITHUB_REF_NAME 是**分支名**（main），不是空值，
          # 所以 `${GITHUB_REF_NAME:-inputs.tag}` 永远取不到手填的 tag，
          # 会打出 repolish-main-*.tar.gz。手填优先，push tag 时它是空串。
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          name="repolish-${tag}-${TARGET}"
          mkdir -p "dist/${name}"

          if [ "$EXT" = "zip" ]; then
            cp "target/${TARGET}/release/repolish.exe" "dist/${name}/"
          else
            cp "target/${TARGET}/release/repolish" "dist/${name}/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${name}/"

          cd dist
          if [ "$EXT" = "zip" ]; then
            7z a -tzip "${name}.zip" "${name}" >/dev/null
          else
            tar -czf "${name}.tar.gz" "${name}"
          fi
          # 校验和让使用者能验证下载物，也方便包管理器接入。
          #
          # 工具名必须两个都试：GitHub 的 `shell: bash` 跑的是
          # `bash --noprofile --norc`，Windows runner 上因此拿不到 Git Bash
          # profile 才会加的 /usr/bin/core_perl，`shasum` 直接找不到；
          # 而 macOS 没有 `sha256sum`。Linux 两个都有。
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${name}.${EXT}" > "${name}.${EXT}.sha256"
          else
            shasum -a 256 "${name}.${EXT}" > "${name}.${EXT}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            dist/*

  # crates.io。跟着 tag 走，而不是在谁的笔记本上跑：
  # 一个能发布正式版本的令牌不该躺在任何一台开发机上，也不该有人记得
  # 「发完二进制还要再手动 cargo publish 一次」——那种步骤迟早会被漏掉。
  #
  # 只在 push tag 时发。workflow_dispatch 是用来补一次二进制构建的，
  # 而 crates.io 的版本发出去只能 yank 不能撤，不该被手动触发顺手带上。
  #
  # 令牌走仓库 secret `CARGO_REGISTRY_TOKEN`。想再加一道人工闸门的话，
  # 给这个 job 挂一个带 required reviewers 的 environment 即可——
  # 这里没挂，是因为没配好的 environment 会让整个 job 起不来。
  crates:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      # 顺序就是依赖顺序：cargo 不接受一个 path 依赖尚未发布的 crate。
      # 只写一处——三个步骤都得用同一份清单,分开写迟早会漏掉一个。
      CRATES: repolish-md repolish-ingest repolish-core repolish-checks repolish-render repolish
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # tag 与 Cargo.toml 里的版本必须是同一个。对不上就停——
      # 发错版本号到 crates.io 是撤不回来的。
      - name: Check the tag matches the manifest
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(awk '/^\[workspace\.package\]/{f=1} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag but Cargo.toml says $manifest"
            exit 1
          fi
          echo "version $manifest"

      # 六个 crate 是一条链，中间断掉会把 registry 留在半发布状态：
      # 三个 0.3.0 已经上去了、三个没有，而已发布的版本只能 yank 不能撤。
      #
      # v0.3.0 就是这样断的——`repolish-md` 收到 403「this crate exists but you
      # don't seem to be an owner」，于是 crates.io 停在 0.2.0，而 GitHub
      # release 和 action 都在说 0.3.0。使用者按 README 敲 `cargo install
      # repolish` 装到的是旧版本，没有任何地方提示他。
      #
      # 一次预检把这个失败挪到「什么都还没发」的时刻，并直接说是哪个 crate、
      # 该找谁。
      - name: Who owns these crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set on this repository"
            exit 1
          fi
          # crates.io 没有一个「这个 token 属于谁」的接口可用——
          # `/api/v1/me` 只对网页会话开放，拿 token 调它一律 403。所以这里
          # 只能把每个 crate 的 owner 列出来放进日志，让 403 发生时有对照物。
          for crate in $CRATES; do
            owners=$(curl -sf -H 'User-Agent: repolish-release' \
                       "https://crates.io/api/v1/crates/$crate/owners" \
                       | jq -r '[.users[]?.login] | join(", ")' 2>/dev/null || true)
            echo "  ${crate}: ${owners:-not published yet}"
          done

      # 顺序就是依赖顺序：cargo 不接受一个 path 依赖尚未发布的 crate。
      # 每发一个都要等索引跟上，否则下一个立刻失败。
      #
      # 已经发过的版本跳过而不是报错：这个 job 重跑一次是常事
      # （比如后半截撞上 crates.io 抖动），重跑不该被前半截挡住。
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          for crate in $CRATES; do
            if cargo search "$crate" --limit 1 2>/dev/null | grep -q "^$crate = \"$version\""; then
              echo "$crate $version is already published — skipping"
              continue
            fi

            echo "::group::publish $crate"
            if ! cargo publish -p "$crate" --locked --no-verify; then
              echo "::endgroup::"
              echo "::error::$crate could not be published. If the message above says \
          'you don't seem to be an owner', the CARGO_REGISTRY_TOKEN secret belongs to an \
          account that does not own it — the owners are listed at the top of this job. \
          Accept the ownership invitation, or replace the secret with a token from an \
          owning account, then re-run."
              exit 1
            fi
            echo "::endgroup::"

            if [ "$crate" != "repolish" ]; then
              printf 'waiting for the index'
              for _ in $(seq 1 60); do
                if cargo search "$crate" --limit 1 2>/dev/null | grep -q "^$crate = \"$version\""; then
                  echo ' ok'; break
                fi
                printf '.'; sleep 5
              done
              echo
            fi
          done

      # 六个 crate 是一条链。中途断掉会把 registry 留在半发布状态,而
      # `cargo install repolish` 拿到的仍然是旧版本,没有任何地方提示使用者。
      # v0.3.0 就是这样悄悄停在 0.2.0 的,整整八天没人发现。
      - name: Confirm every crate actually landed
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          missing=""
          for crate in $CRATES; do
            if cargo search "$crate" --limit 1 2>/dev/null | grep -q "^$crate = \"$version\""; then
              echo "  $crate $version ok"
            else
              missing="$missing $crate"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::these crates are not on crates.io at $version:$missing"
            exit 1
          fi

      - name: Summary
        run: echo "Published https://crates.io/crates/repolish/${GITHUB_REF_NAME#v}" >> "$GITHUB_STEP_SUMMARY"

  # 浮动的大版本 tag（v0.3.0 → v0）。
  #
  # Actions 生态的惯例是 `uses: owner/repo@v1`：使用者钉住大版本，补丁跟着走。
  # 我们从前只推精确 tag，于是 README 的示例写着 `@v0.3.0` —— 每发一个补丁，
  # 每个用了这个 action 的仓库都得改一行。没有人会去改，结果是所有人永远
  # 停在他第一次复制的那个版本上。
  #
  # 跟着 `publish` 而不是 `crates`：action 下载的是 GitHub release 的二进制，
  # crates.io 发没发成功与它无关。
  major-tag:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move the major tag
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          # 预发布版本不动浮动 tag：`@v0` 指向一个 rc,是把所有使用者
          # 一起拖进预发布
          case "$tag" in
            *-*) echo "$tag is a pre-release; leaving the major tag alone"; exit 0 ;;
          esac

          major="${tag%%.*}"          # v0.3.0 -> v0
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -f -a "$major" -m "$major -> $tag" "$tag^{commit}"
          git push -f origin "refs/tags/$major"
          echo "$major now points at $tag" >> "$GITHUB_STEP_SUMMARY"

  # npm。发的是一个薄壳：它下载这次 release 的二进制，校验 sha256,再执行。
  #
  # 为什么要有它：repolish 检查的仓库绝大多数不是 Rust 项目，而
  # `cargo install repolish` 要求对方先装一整套 Rust 工具链。对一个
  # 「跑一次看看分数」的工具来说，那是一道劝退的门槛。
  #
  # 跟着 `publish`：壳要下载的正是那个 job 传上去的产物。
  npm:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `npm publish --provenance` 要签一份来源证明。同一条思路:
      # 二进制配 .sha256、npm 包配 provenance——使用者能自己核对拿到的是什么。
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # 包版本就是下载 URL 的一部分。对不上的话，npm 上装到的是一个
      # 版本号说 A、二进制是 B 的东西——最难查的那一类问题。
      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./npm/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag but npm/package.json says $pkg"
            exit 1
          fi
          node npm/test.js

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN is not set; skipping the npm release"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          # 重跑这个 job 是常事。已经发过的版本跳过，不要报错。
          if npm view "repolish@$version" version >/dev/null 2>&1; then
            echo "repolish@$version is already on npm — skipping"
            exit 0
          fi
          cd npm
          npm publish --provenance --access public
          echo "Published https://www.npmjs.com/package/repolish/v/$version" >> "$GITHUB_STEP_SUMMARY"
