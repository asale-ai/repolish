# 重新生成提交在仓库里的产物，并提交回去。
#
# **只手动触发。** 从前这些是 CI 每次 push 自动做的，代价比收益大：
# 任何人在本地重新生成同样的文件都会和那条自动提交撞车（连着五次 rebase
# 冲突），而一个会自己往 main 上推提交的 CI 需要 contents: write 权限，
# 只为了刷新几张图。
#
# 这些文件必须留在仓库里——shields.io 读的是 raw.githubusercontent.com 上的
# badge.json，README 里的 <img> 指的是 .repolish 下的 SVG——但它们跟着**内容**
# 变，不跟着 push 变。改了 README 的表格、加了一门语言、发了一个版本，
# 才需要跑这个。
#
# 录屏不在这里：它带着样例仓库的 commit 哈希，每次跑都会变。见 demo.yml。
name: artifacts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    name: regenerate the committed artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # release-hygiene 要看 tag；默认的 fetch-depth: 1 一个都拉不到
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 一次跑完所有产物。分开跑不只是多打几次 GitHub API，
      # 更要命的是几份产物可能来自不同次的评分结果。
      - name: Badge, report and cards
        run: |
          cargo run --release -- check . --remote --no-color \
            --badge --report --card --overview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 表格图跟着 README 走：作者改了一行表格，图就该跟着变。
      # 用 card 而不是 polish 来重画——polish 从不覆盖任何文件，
      # 第二次跑就是空操作，README 上会一直挂着第一次画的那张图。
      #
      # 中文 README 引的是另一套卡片与另一张横幅。这个仓库自己就是 --lang
      # 的活样例：一张写着 LANGUAGES · BY FILE 的卡片贴在中文 README 顶上，
      # 是我们把自己的语言塞进了别人的门面。
      - name: Tables, the Chinese cards, and the brand assets
        run: |
          cargo run --release -- card . --kind tables
          cargo run --release -- card . --kind overview --lang zh-CN \
            --output .repolish/overview.zh-CN.svg
          cargo run --release -- card . --kind score --lang zh-CN \
            --output .repolish/card.zh-CN.svg
          cargo run --release -p repolish-render --example logo

      - name: Commit
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add .repolish assets REPOLISH.md
          git diff --staged --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "chore: regenerate the committed artifacts"
          git push
