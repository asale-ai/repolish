# 必须放在仓库根目录：`uses: owner/repo@ref` 只认根目录的 action.yml。
# 放进 action/ 子目录的话，引用要写成 owner/repo/action@ref，
# 与 docs/02-cli-design.zh-CN.md 里给用户的模板对不上。用法示例在 action/README.md。
name: repolish
description: Score an open-source repository on discoverability, comprehensibility, and credibility, and emit a badge
author: repolish contributors

branding:
  icon: check-circle
  color: green

inputs:
  version:
    description: repolish release to download, without the v prefix
    required: false
    default: 0.4.3
  path:
    description: Path to the repository
    required: false
    default: "."
  remote:
    description: >
      Read description / topics / homepage from the GitHub API. On by default:
      inside an Action, GITHUB_TOKEN costs nothing, and a local score drops those
      three checks from the denominator, which narrows the baseline.
    required: false
    default: "true"
  min-score:
    description: Fail this step below the given score. Leave empty to record without enforcing.
    required: false
    default: ""
  badge:
    description: Write .repolish/badge.json
    required: false
    default: "true"
  report:
    description: Write REPOLISH.md
    required: false
    default: "false"
  card:
    description: >
      Write .repolish/card.svg, the report card. It belongs at the *end* of the
      README, under a "Polished with repolish" heading. Off by default: it is
      only worth committing once you have linked it from somewhere.
    required: false
    default: "false"
  overview:
    description: >
      Write .repolish/overview.svg, the project overview card — languages, file
      composition, commit activity, licence. That one belongs at the *top* of
      the README: the first thing a stranger sees should be the project, not our
      score. Off by default, same reason as card.
    required: false
    default: "false"
  theme:
    description: >
      Palette for the SVG cards. One of dark, porcelain, slate, nord, ember,
      solar, phosphor, blueprint, okabe, newsprint, sakura, glacier, carbon,
      paper. All fourteen are rendered side by side in docs/themes/.
    required: false
    default: dark
  lang:
    description: >
      Language for the text inside the cards: auto, en or zh-CN.
      auto follows whatever language the README is written in.
    required: false
    default: auto
  summary:
    description: Append the report to the job summary
    required: false
    default: "true"
  base:
    description: >
      Also score this git ref and report the difference — "origin/main", or
      ${{ github.event.pull_request.base.sha }} on a pull request. Needs
      actions/checkout with fetch-depth: 0, because the baseline commit has to
      exist locally.
    required: false
    default: ""
  sarif:
    description: >
      Write SARIF 2.1.0 to this path. Feed it to github/codeql-action/upload-sarif
      and every finding lands on its own line in the pull request diff.
      Needs `security-events: write` on the job.
    required: false
    default: ""
  comment:
    description: >
      Post the short report as a pull request comment, editing the previous one
      in place rather than adding another. Needs `pull-requests: write` on the
      job, and only does anything on a pull_request event.
    required: false
    default: "false"
  args:
    description: >
      Raw arguments; when given, they override every switch above. They are passed
      to `repolish` verbatim, and there are no subcommands — start with the path.
    required: false
    default: ""

outputs:
  score:
    description: Total score (0-100); empty when coverage was too low to produce one
    value: ${{ steps.run.outputs.score }}
  points:
    description: >
      Change against `base`, e.g. -4. Empty when no base was given, or when
      either side produced no total score.
    value: ${{ steps.run.outputs.points }}

runs:
  using: composite
  steps:
    - name: Install repolish
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)    target=x86_64-unknown-linux-gnu;  ext=tar.gz ;;
          Linux-ARM64)  target=aarch64-unknown-linux-gnu; ext=tar.gz ;;
          macOS-X64)    target=x86_64-apple-darwin;       ext=tar.gz ;;
          macOS-ARM64)  target=aarch64-apple-darwin;      ext=tar.gz ;;
          Windows-X64)  target=x86_64-pc-windows-msvc;    ext=zip ;;
          *)
            echo "::error::unsupported runner: $RUNNER_OS-$RUNNER_ARCH"
            exit 1 ;;
        esac

        asset="repolish-v${VERSION}-${target}.${ext}"
        url="https://github.com/asale-ai/repolish/releases/download/v${VERSION}/${asset}"
        dir="${RUNNER_TEMP}/repolish"
        mkdir -p "$dir"

        echo "downloading $url"
        curl -fsSL --retry 3 -o "${dir}/${asset}" "$url"

        if [ "$ext" = "zip" ]; then
          unzip -q -o "${dir}/${asset}" -d "$dir"
        else
          tar -xzf "${dir}/${asset}" -C "$dir"
        fi

        # 归档里带一层以 target 命名的目录
        bin_dir="${dir}/repolish-v${VERSION}-${target}"
        [ -d "$bin_dir" ] || bin_dir="$dir"
        echo "$bin_dir" >> "$GITHUB_PATH"

    - name: Run repolish
      id: run
      shell: bash
      env:
        IN_PATH: ${{ inputs.path }}
        IN_REMOTE: ${{ inputs.remote }}
        IN_MIN_SCORE: ${{ inputs['min-score'] }}
        IN_BADGE: ${{ inputs.badge }}
        IN_REPORT: ${{ inputs.report }}
        IN_CARD: ${{ inputs.card }}
        IN_OVERVIEW: ${{ inputs.overview }}
        IN_THEME: ${{ inputs.theme }}
        IN_LANG: ${{ inputs.lang }}
        IN_SUMMARY: ${{ inputs.summary }}
        IN_BASE: ${{ inputs.base }}
        IN_SARIF: ${{ inputs.sarif }}
        IN_COMMENT: ${{ inputs.comment }}
        # PR 号从事件上下文里取，不去解析 event payload：
        # 非 PR 事件下它就是空串，正好是「没什么可评论的」
        IN_PR: ${{ github.event.pull_request.number }}
        IN_ARGS: ${{ inputs.args }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -uo pipefail

        # 只跑一次。分开跑不只是多打几次 GitHub API，更要命的是
        # 几份产物可能来自不同次的评分结果。
        # summary 需要 markdown，所以顺带让这一次也写出 REPOLISH.md。
        # args 是逃生舱：给了就完全接管，badge / report / summary 一概不插手，
        # 因为我们无从知道那串参数产出了什么。
        raw=false
        [ -n "$IN_ARGS" ] && raw=true

        want_md=false
        if [ "$raw" = "false" ] && { [ "$IN_SUMMARY" = "true" ] || [ "$IN_REPORT" = "true" ]; }; then
          want_md=true
        fi

        # 仓库里可能已经提交了一份 REPOLISH.md。为了 summary 而覆盖它是可以的，
        # 跑完必须原样放回——直接 rm 会在用户的工作区留下一条删除，
        # 而他的 workflow 下一步往往就是 git add + commit。
        md="${IN_PATH}/REPOLISH.md"
        backup=""
        if [ "$want_md" = "true" ] && [ "$IN_REPORT" != "true" ] && [ -f "$md" ]; then
          backup="${RUNNER_TEMP}/REPOLISH.md.orig"
          cp "$md" "$backup"
        fi

        json="${RUNNER_TEMP}/repolish.json"
        if [ "$raw" = "true" ]; then
          # shellcheck disable=SC2086
          set -- $IN_ARGS
        else
          # 阶段是显式的，而且**永远不含 polish**：在 CI 里改别人的 README
          # 不是这个 action 该做的事。要产物才加 artifacts，要产物才加
          # --apply——没有 --apply 时 repolish 一个字节都不写。
          stages=check
          if [ "$IN_BADGE" = "true" ] || [ "$IN_CARD" = "true" ] \
             || [ "$IN_OVERVIEW" = "true" ] || [ "$want_md" = "true" ]; then
            stages=check,artifacts
          fi

          set -- "$IN_PATH" --no-color --format json --stages "$stages"
          [ "$stages" = "check,artifacts" ] && set -- "$@" --apply
          [ "$IN_REMOTE" = "true" ] && set -- "$@" --remote
          [ "$IN_BADGE" != "true" ] && set -- "$@" --no-badge
          [ "$IN_CARD" = "true" ] && set -- "$@" --footer-card
          [ "$IN_OVERVIEW" = "true" ] && set -- "$@" --overview
          if [ "$IN_CARD" = "true" ] || [ "$IN_OVERVIEW" = "true" ]; then
            set -- "$@" --theme "$IN_THEME" --lang "$IN_LANG"
          fi
          [ "$want_md" = "true" ] && set -- "$@" --report
          [ -n "$IN_MIN_SCORE" ] && set -- "$@" --min-score "$IN_MIN_SCORE"
          [ -n "$IN_BASE" ] && set -- "$@" --base "$IN_BASE"
          [ -n "$IN_SARIF" ] && set -- "$@" --sarif "$IN_SARIF"
          # 评论体作为副产物写出来，而不是再跑一次 repolish：跑两次是
          # 两倍的 GitHub API 调用，更要命的是两次的分数可能不一样。
          [ "$IN_COMMENT" = "true" ] && set -- "$@" --comment "${RUNNER_TEMP}/repolish-comment.md"
        fi

        repolish "$@" | tee "$json"
        code=${PIPESTATUS[0]}

        # 用 jq 而不是 grep：报告里 "score" 出现在顶层、每个类别里、
        # 还有 delta 的两侧，靠第一个匹配取值是碰运气。jq 在每一台
        # GitHub runner 上都预装了。
        # 覆盖不足时 score 是 null，`// empty` 把它变成空串，正合适。
        # `args` 逃生舱下输出未必是 JSON，所以两个都容忍失败。
        score="$(jq -r '.score // empty' "$json" 2>/dev/null || true)"
        echo "score=${score}" >> "$GITHUB_OUTPUT"

        points="$(jq -r '.delta.points // empty' "$json" 2>/dev/null || true)"
        echo "points=${points}" >> "$GITHUB_OUTPUT"

        if [ "$want_md" = "true" ] && [ "$IN_SUMMARY" = "true" ] && [ -f "$md" ]; then
          cat "$md" >> "$GITHUB_STEP_SUMMARY"
        fi

        # PR 评论：**改写上一条，而不是再加一条**。一个每次 push 都新增一条
        # 评论的机器人，三次之后就会被所有人折叠,连带把真正变红的那一次
        # 一起埋掉。
        body="${RUNNER_TEMP}/repolish-comment.md"
        if [ "$IN_COMMENT" = "true" ] && [ -f "$body" ]; then
          pr="$IN_PR"
          if [ -z "$pr" ]; then
            echo "::notice::comment: not a pull request event, nothing posted"
          else
            api="repos/${GITHUB_REPOSITORY}/issues"
            existing="$(gh api "${api}/${pr}/comments" --paginate \
              --jq 'map(select(.body | startswith("<!-- repolish-report -->"))) | .[-1].id // empty' 2>/dev/null || true)"
            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
                -F body=@"$body" >/dev/null \
                && echo "updated the repolish comment on #${pr}" \
                || echo "::warning::could not update the comment — does the job have pull-requests: write?"
            else
              gh api -X POST "${api}/${pr}/comments" -F body=@"$body" >/dev/null \
                && echo "commented on #${pr}" \
                || echo "::warning::could not comment — does the job have pull-requests: write?"
            fi
          fi
        fi

        # 只是为了 summary 才生成的，别留在工作区里被顺手提交
        if [ "$want_md" = "true" ] && [ "$IN_REPORT" != "true" ]; then
          if [ -n "$backup" ]; then
            mv "$backup" "$md"
          else
            rm -f "$md"
          fi
        fi

        # 退出码要原样传出去：1 表示分数不达标，4 表示远程调用失败，
        # 两者在 CI 里意味着完全不同的事。
        exit $code
