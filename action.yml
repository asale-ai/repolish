# 必须放在仓库根目录：`uses: owner/repo@ref` 只认根目录的 action.yml。
# 放进 action/ 子目录的话，引用要写成 owner/repo/action@ref，
# 与 docs/02-CLI设计.md 里给用户的模板对不上。用法示例在 action/README.md。
name: repolish
description: Score an open-source repository on discoverability, comprehensibility, and credibility, and emit a badge
author: repolish contributors

branding:
  icon: check-circle
  color: green

inputs:
  version:
    description: repolish release to download, without the v prefix
    required: false
    default: 0.2.0
  path:
    description: Path to the repository
    required: false
    default: "."
  remote:
    description: >
      Read description / topics / homepage from the GitHub API. On by default:
      inside an Action, GITHUB_TOKEN costs nothing, and a local score drops those
      three checks from the denominator, which narrows the baseline.
    required: false
    default: "true"
  min-score:
    description: Fail this step below the given score. Leave empty to record without enforcing.
    required: false
    default: ""
  badge:
    description: Write .repolish/badge.json
    required: false
    default: "true"
  report:
    description: Write REPOLISH.md
    required: false
    default: "false"
  summary:
    description: Append the report to the job summary
    required: false
    default: "true"
  args:
    description: Raw arguments; when given, they override every switch above
    required: false
    default: ""

outputs:
  score:
    description: Total score (0-100); empty when coverage was too low to produce one
    value: ${{ steps.run.outputs.score }}

runs:
  using: composite
  steps:
    - name: Install repolish
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)    target=x86_64-unknown-linux-gnu;  ext=tar.gz ;;
          Linux-ARM64)  target=aarch64-unknown-linux-gnu; ext=tar.gz ;;
          macOS-X64)    target=x86_64-apple-darwin;       ext=tar.gz ;;
          macOS-ARM64)  target=aarch64-apple-darwin;      ext=tar.gz ;;
          Windows-X64)  target=x86_64-pc-windows-msvc;    ext=zip ;;
          *)
            echo "::error::unsupported runner: $RUNNER_OS-$RUNNER_ARCH"
            exit 1 ;;
        esac

        asset="repolish-v${VERSION}-${target}.${ext}"
        url="https://github.com/asale-ai/repolish/releases/download/v${VERSION}/${asset}"
        dir="${RUNNER_TEMP}/repolish"
        mkdir -p "$dir"

        echo "downloading $url"
        curl -fsSL --retry 3 -o "${dir}/${asset}" "$url"

        if [ "$ext" = "zip" ]; then
          unzip -q -o "${dir}/${asset}" -d "$dir"
        else
          tar -xzf "${dir}/${asset}" -C "$dir"
        fi

        # 归档里带一层以 target 命名的目录
        bin_dir="${dir}/repolish-v${VERSION}-${target}"
        [ -d "$bin_dir" ] || bin_dir="$dir"
        echo "$bin_dir" >> "$GITHUB_PATH"

    - name: Run repolish
      id: run
      shell: bash
      env:
        IN_PATH: ${{ inputs.path }}
        IN_REMOTE: ${{ inputs.remote }}
        IN_MIN_SCORE: ${{ inputs['min-score'] }}
        IN_BADGE: ${{ inputs.badge }}
        IN_REPORT: ${{ inputs.report }}
        IN_SUMMARY: ${{ inputs.summary }}
        IN_ARGS: ${{ inputs.args }}
      run: |
        set -uo pipefail

        # 只跑一次。分开跑不只是多打几次 GitHub API，更要命的是
        # 几份产物可能来自不同次的评分结果。
        # summary 需要 markdown，所以顺带让这一次也写出 REPOLISH.md。
        # args 是逃生舱：给了就完全接管，badge / report / summary 一概不插手，
        # 因为我们无从知道那串参数产出了什么。
        raw=false
        [ -n "$IN_ARGS" ] && raw=true

        want_md=false
        if [ "$raw" = "false" ] && { [ "$IN_SUMMARY" = "true" ] || [ "$IN_REPORT" = "true" ]; }; then
          want_md=true
        fi

        # 仓库里可能已经提交了一份 REPOLISH.md。为了 summary 而覆盖它是可以的，
        # 跑完必须原样放回——直接 rm 会在用户的工作区留下一条删除，
        # 而他的 workflow 下一步往往就是 git add + commit。
        md="${IN_PATH}/REPOLISH.md"
        backup=""
        if [ "$want_md" = "true" ] && [ "$IN_REPORT" != "true" ] && [ -f "$md" ]; then
          backup="${RUNNER_TEMP}/REPOLISH.md.orig"
          cp "$md" "$backup"
        fi

        json="${RUNNER_TEMP}/repolish.json"
        if [ "$raw" = "true" ]; then
          # shellcheck disable=SC2086
          set -- $IN_ARGS
        else
          set -- check "$IN_PATH" --no-color --format json
          [ "$IN_REMOTE" = "true" ] && set -- "$@" --remote
          [ "$IN_BADGE" = "true" ] && set -- "$@" --badge
          [ "$want_md" = "true" ] && set -- "$@" --report
          [ -n "$IN_MIN_SCORE" ] && set -- "$@" --min-score "$IN_MIN_SCORE"
        fi

        repolish "$@" | tee "$json"
        code=${PIPESTATUS[0]}

        # 顶层 score 是 JSON 里第一个 "score" 键；覆盖不足时它是 null，
        # 取出来就是空串，正合适。
        score="$(grep -m1 '"score":' "$json" 2>/dev/null | tr -dc '0-9' || true)"
        echo "score=${score}" >> "$GITHUB_OUTPUT"

        if [ "$want_md" = "true" ] && [ "$IN_SUMMARY" = "true" ] && [ -f "$md" ]; then
          cat "$md" >> "$GITHUB_STEP_SUMMARY"
        fi

        # 只是为了 summary 才生成的，别留在工作区里被顺手提交
        if [ "$want_md" = "true" ] && [ "$IN_REPORT" != "true" ]; then
          if [ -n "$backup" ]; then
            mv "$backup" "$md"
          else
            rm -f "$md"
          fi
        fi

        # 退出码要原样传出去：1 表示分数不达标，4 表示远程调用失败，
        # 两者在 CI 里意味着完全不同的事。
        exit $code
