[package]
# 包名即 `cargo install` 的名字，必须与二进制名一致——
# 目录仍叫 repolish-cli，是为了和其余 crate 的命名保持一致。
name = "repolish"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Scores what your open-source repo looks like to a first-time visitor, and checks that the commands your README promises actually exist."
repository = "https://github.com/asale-ai/repolish"
homepage = "https://github.com/asale-ai/repolish"
readme = "../../README.md"
keywords = ["readme", "documentation", "lint", "cli", "open-source"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "repolish"
path = "src/main.rs"

[dependencies]
repolish-core.workspace = true
repolish-ingest.workspace = true
repolish-checks.workspace = true
repolish-md.workspace = true
repolish-render.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
dunce.workspace = true
# `polish --suggest` 那一条路要发一次 HTTPS。与 ingest 用同一个客户端,
# 不为一个可选功能再拖一套 TLS 进来。
ureq.workspace = true
