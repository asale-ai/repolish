[workspace]
resolver = "2"
members = ["crates/*"]
# demo/sample 是给 VHS 演示用的样例仓库，故意写得很糙，不是工作区成员
exclude = ["demo"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
repolish-core   = { path = "crates/repolish-core", version = "0.3.0" }
repolish-ingest = { path = "crates/repolish-ingest", version = "0.3.0" }
repolish-md     = { path = "crates/repolish-md", version = "0.3.0" }
repolish-checks = { path = "crates/repolish-checks", version = "0.3.0" }
repolish-render = { path = "crates/repolish-render", version = "0.3.0" }

anyhow      = "1"
thiserror   = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
comrak      = { version = "0.54", default-features = false }
ignore      = "0.4"
dunce       = "1"
gix         = { version = "0.86", default-features = false, features = ["basic", "sha1", "max-performance-safe"] }
clap        = { version = "4", features = ["derive"] }
ureq        = { version = "3", features = ["json"] }
toml        = "0.9"

[profile.release]
lto = "thin"
strip = true
