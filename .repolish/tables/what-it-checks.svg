<svg xmlns="http://www.w3.org/2000/svg" width="880" height="257" viewBox="0 0 880 257" lang="en" role="img" aria-label="What it checks — table">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d56f4"/>
      <stop offset="0.55" stop-color="#ff5fd1"/>
      <stop offset="1" stop-color="#43e5d0"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", "Noto Sans Mono CJK JP", "Microsoft YaHei", "Hiragino Sans", "Yu Gothic", monospace; }
  </style>
  <rect x="0" y="0" width="880" height="257" rx="18.0" fill="#1a1a24"/>
  <rect x="0.5" y="0.5" width="879" height="256" rx="17.5" fill="none" stroke="#35334a"/>
  <text class="t" x="28" y="38" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">WHAT IT CHECKS</text>
  <text class="t" x="28" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">CATEGORY</text>
  <text class="t" x="189" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">CHECKS</text>
  <rect x="28" y="78" width="824" height="1" fill="#35334a"/>
  <text class="t" x="28" y="102" font-size="13" fill="#edebfa" text-anchor="start">Discoverability</text>
  <text class="t" x="189" y="102" font-size="13" fill="#edebfa" text-anchor="start">README title and tagline, repository description, topics, homepage, badges</text>
  <rect x="20" y="113" width="840" height="53" rx="5.0" fill="#222130"/>
  <text class="t" x="28" y="137" font-size="13" fill="#edebfa" text-anchor="start">Comprehensibility</text>
  <text class="t" x="189" y="137" font-size="13" fill="#edebfa" text-anchor="start">quickstart, usage example, install-command consistency, link health, length, docs</text>
  <text class="t" x="189" y="155" font-size="13" fill="#edebfa" text-anchor="start">presence, table of contents, translations</text>
  <text class="t" x="28" y="190" font-size="13" fill="#edebfa" text-anchor="start">Credibility</text>
  <text class="t" x="189" y="190" font-size="13" fill="#edebfa" text-anchor="start">license, claim consistency, CI, tests, activity, contributing guide, issue and PR</text>
  <text class="t" x="189" y="208" font-size="13" fill="#edebfa" text-anchor="start">templates, release hygiene, code of conduct</text>
  <rect x="28" y="219" width="824" height="1" fill="#35334a"/>
</svg>
