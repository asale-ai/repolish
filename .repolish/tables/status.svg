<svg xmlns="http://www.w3.org/2000/svg" width="880" height="484" viewBox="0 0 880 484" lang="en" role="img" aria-label="Status — table">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d56f4"/>
      <stop offset="0.55" stop-color="#ff5fd1"/>
      <stop offset="1" stop-color="#43e5d0"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", "Microsoft YaHei", monospace; }
  </style>
  <rect x="0" y="0" width="880" height="484" rx="18.0" fill="#1a1a24"/>
  <rect x="0.5" y="0.5" width="879" height="483" rx="17.5" fill="none" stroke="#35334a"/>
  <text class="t" x="28" y="38" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">STATUS</text>
  <rect x="28" y="60" width="824" height="1" fill="#35334a"/>
  <text class="t" x="58" y="84" font-size="15" fill="#43e5d0" text-anchor="end" font-weight="700">✓</text>
  <text class="t" x="78" y="84" font-size="13" fill="#edebfa" text-anchor="start">check — 22 checks, --remote, JSON output, --min-score</text>
  <rect x="20" y="95" width="840" height="35" rx="5.0" fill="#222130"/>
  <text class="t" x="58" y="119" font-size="15" fill="#43e5d0" text-anchor="end" font-weight="700">✓</text>
  <text class="t" x="78" y="119" font-size="13" fill="#edebfa" text-anchor="start">badge, report, init, GitHub Action, pre-built binaries for 5 targets, published on crates.io</text>
  <text class="t" x="58" y="154" font-size="15" fill="#43e5d0" text-anchor="end" font-weight="700">✓</text>
  <text class="t" x="78" y="154" font-size="13" fill="#edebfa" text-anchor="start">polish --apply — badge, table of contents, issue / PR templates, CONTRIBUTING; only-insert, never</text>
  <text class="t" x="78" y="172" font-size="13" fill="#edebfa" text-anchor="start">rewrites</text>
  <rect x="20" y="183" width="840" height="53" rx="5.0" fill="#222130"/>
  <text class="t" x="58" y="207" font-size="15" fill="#43e5d0" text-anchor="end" font-weight="700">✓</text>
  <text class="t" x="78" y="207" font-size="13" fill="#edebfa" text-anchor="start">card — an overview card for the top of the README and a report card for the end, self-contained</text>
  <text class="t" x="78" y="225" font-size="13" fill="#edebfa" text-anchor="start">SVG, dark or porcelain, English or Chinese</text>
  <text class="t" x="58" y="260" font-size="15" fill="#43e5d0" text-anchor="end" font-weight="700">✓</text>
  <text class="t" x="78" y="260" font-size="13" fill="#edebfa" text-anchor="start">--tables svg — README tables drawn as SVG, the original folded into</text>
  <rect x="20" y="271" width="840" height="35" rx="5.0" fill="#222130"/>
  <text class="t" x="58" y="295" font-size="15" fill="#43e5d0" text-anchor="end" font-weight="700">✓</text>
  <text class="t" x="78" y="295" font-size="13" fill="#edebfa" text-anchor="start">scan — rank every repository in a directory, and surface the gaps they share</text>
  <text class="t" x="58" y="330" font-size="15" fill="#43e5d0" text-anchor="end" font-weight="700">✓</text>
  <text class="t" x="78" y="330" font-size="13" fill="#edebfa" text-anchor="start">demo — records the detected CLI by running it, as an animated SVG; --tape for a VHS GIF instead</text>
  <rect x="20" y="341" width="840" height="35" rx="5.0" fill="#222130"/>
  <text class="t" x="58" y="365" font-size="15" fill="#43e5d0" text-anchor="end" font-weight="700">✓</text>
  <text class="t" x="78" y="365" font-size="13" fill="#edebfa" text-anchor="start">skill — SKILL.md, so a coding agent measures before it edits</text>
  <text class="t" x="58" y="400" font-size="15" fill="#43e5d0" text-anchor="end" font-weight="700">✓</text>
  <text class="t" x="78" y="400" font-size="13" fill="#edebfa" text-anchor="start">.repolish.toml, and styling options for everything polish inserts</text>
  <rect x="20" y="411" width="840" height="35" rx="5.0" fill="#222130"/>
  <text class="t" x="58" y="435" font-size="15" fill="#ffc53d" text-anchor="end" font-weight="700">◔</text>
  <text class="t" x="78" y="435" font-size="13" fill="#edebfa" text-anchor="start">LLM-assisted wording suggestions, still with no model in the scoring path</text>
  <rect x="28" y="446" width="824" height="1" fill="#35334a"/>
</svg>
