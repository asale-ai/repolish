<svg xmlns="http://www.w3.org/2000/svg" width="880" height="256" viewBox="0 0 880 256" lang="en" role="img" aria-label="One line — table">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d56f4"/>
      <stop offset="0.55" stop-color="#ff5fd1"/>
      <stop offset="1" stop-color="#43e5d0"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", "Microsoft YaHei", monospace; }
  </style>
  <rect x="0" y="0" width="880" height="256" rx="18.0" fill="#1a1a24"/>
  <rect x="0.5" y="0.5" width="879" height="255" rx="17.5" fill="none" stroke="#35334a"/>
  <text class="t" x="28" y="38" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">ONE LINE</text>
  <text class="t" x="28" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">VARIABLE</text>
  <text class="t" x="190" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">DEFAULT</text>
  <text class="t" x="327" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">WHAT IT DOES</text>
  <rect x="28" y="78" width="824" height="1" fill="#35334a"/>
  <rect x="28" y="89" width="127" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="102" font-size="12" fill="#edebfa" text-anchor="start">REPOLISH_VERSION</text>
  <text class="t" x="190" y="102" font-size="13" fill="#edebfa" text-anchor="start">latest release</text>
  <text class="t" x="327" y="102" font-size="13" fill="#edebfa" text-anchor="start">Install a specific tag, e.g. v0.2.0</text>
  <rect x="20" y="113" width="840" height="35" rx="5.0" fill="#222130"/>
  <rect x="28" y="124" width="127" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="137" font-size="12" fill="#edebfa" text-anchor="start">REPOLISH_BIN_DIR</text>
  <rect x="190" y="124" width="98" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="196" y="137" font-size="12" fill="#edebfa" text-anchor="start">~/.local/bin</text>
  <text class="t" x="327" y="137" font-size="13" fill="#edebfa" text-anchor="start">Where the binary goes</text>
  <rect x="28" y="159" width="120" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="172" font-size="12" fill="#edebfa" text-anchor="start">REPOLISH_TARGET</text>
  <rect x="190" y="159" width="55" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="196" y="172" font-size="12" fill="#edebfa" text-anchor="start">detect</text>
  <text class="t" x="327" y="172" font-size="13" fill="#edebfa" text-anchor="start">Which agents get the skill: detect, all, none, or one id</text>
  <rect x="20" y="183" width="840" height="35" rx="5.0" fill="#222130"/>
  <rect x="28" y="194" width="134" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="207" font-size="12" fill="#edebfa" text-anchor="start">REPOLISH_NO_SKILL</text>
  <text class="t" x="190" y="207" font-size="13" fill="#edebfa" text-anchor="start">unset</text>
  <text class="t" x="327" y="207" font-size="13" fill="#edebfa" text-anchor="start">Set to 1 for the binary only</text>
  <rect x="28" y="218" width="824" height="1" fill="#35334a"/>
</svg>
