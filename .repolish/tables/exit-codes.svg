<svg xmlns="http://www.w3.org/2000/svg" width="880" height="396" viewBox="0 0 880 396" lang="en" role="img" aria-label="Exit codes — table">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d56f4"/>
      <stop offset="0.55" stop-color="#ff5fd1"/>
      <stop offset="1" stop-color="#43e5d0"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", "Noto Sans Mono CJK JP", "Microsoft YaHei", "Hiragino Sans", "Yu Gothic", monospace; }
  </style>
  <rect x="0" y="0" width="880" height="396" rx="18.0" fill="#1a1a24"/>
  <rect x="0.5" y="0.5" width="879" height="395" rx="17.5" fill="none" stroke="#35334a"/>
  <text class="t" x="28" y="38" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">EXIT CODES</text>
  <text class="t" x="62" y="68" font-size="11" fill="#8b87a3" text-anchor="end" letter-spacing="1.4">CODE</text>
  <text class="t" x="82" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">MEANING</text>
  <rect x="28" y="78" width="824" height="1" fill="#35334a"/>
  <text class="t" x="62" y="102" font-size="13" fill="#edebfa" text-anchor="end" font-weight="700">0</text>
  <text class="t" x="82" y="102" font-size="13" fill="#edebfa" text-anchor="start">Success</text>
  <rect x="20" y="113" width="840" height="35" rx="5.0" fill="#222130"/>
  <text class="t" x="62" y="137" font-size="13" fill="#edebfa" text-anchor="end" font-weight="700">1</text>
  <text class="t" x="82" y="137" font-size="13" fill="#edebfa" text-anchor="start">Score below --min-score, or a README command failed under verify</text>
  <text class="t" x="62" y="172" font-size="13" fill="#edebfa" text-anchor="end" font-weight="700">2</text>
  <text class="t" x="82" y="172" font-size="13" fill="#edebfa" text-anchor="start">Bad arguments</text>
  <rect x="20" y="183" width="840" height="35" rx="5.0" fill="#222130"/>
  <text class="t" x="62" y="207" font-size="13" fill="#edebfa" text-anchor="end" font-weight="700">3</text>
  <text class="t" x="82" y="207" font-size="13" fill="#edebfa" text-anchor="start">Not a valid repository</text>
  <text class="t" x="62" y="242" font-size="13" fill="#edebfa" text-anchor="end" font-weight="700">4</text>
  <text class="t" x="82" y="242" font-size="13" fill="#edebfa" text-anchor="start">--remote failed (API error, rate limit, private repo)</text>
  <rect x="20" y="253" width="840" height="35" rx="5.0" fill="#222130"/>
  <text class="t" x="62" y="277" font-size="13" fill="#edebfa" text-anchor="end" font-weight="700">5</text>
  <text class="t" x="82" y="277" font-size="13" fill="#edebfa" text-anchor="start">Fewer than half the checks could run — no total score is reported</text>
  <text class="t" x="62" y="312" font-size="13" fill="#edebfa" text-anchor="end" font-weight="700">6</text>
  <text class="t" x="82" y="312" font-size="13" fill="#edebfa" text-anchor="start">verify --run could not run: no container engine, or the container died</text>
  <rect x="20" y="323" width="840" height="35" rx="5.0" fill="#222130"/>
  <text class="t" x="62" y="347" font-size="13" fill="#edebfa" text-anchor="end" font-weight="700">7</text>
  <text class="t" x="82" y="347" font-size="13" fill="#edebfa" text-anchor="start">--base could not be resolved: shallow clone, unknown ref, no git</text>
  <rect x="28" y="358" width="824" height="1" fill="#35334a"/>
</svg>
